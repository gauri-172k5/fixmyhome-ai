<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FixMyHome AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3f6fc;--pn:#fff;--ln:#d6dfef;--tx:#0e1a33;--mu:#55657f;--ac:#0891b2;--ac2:#2563eb;--ok:#059669;--bd:#dc2626;--wn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1120;--pn:#111b30;--ln:#22314f;--tx:#e8eefc;--mu:#9fb0d0;--ac:#22d3ee;--ac2:#3b82f6;--ok:#34d399;--bd:#f87171;--wn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0a1120;--pn:#111b30;--ln:#22314f;--tx:#e8eefc;--mu:#9fb0d0;--ac:#22d3ee;--ac2:#3b82f6;--ok:#34d399;--bd:#f87171;--wn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--ln);z-index:9;padding:8px 12px}
.brand{font-weight:800;text-decoration:none;color:var(--tx)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:thin}
nav a{white-space:nowrap;color:var(--mu);text-decoration:none;padding:5px 10px;border-radius:99px;border:1px solid var(--ln);font-size:.85rem}
nav a.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
main{max-width:920px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 16px rgba(0,0,0,.07)}
.nar{max-width:440px;margin:24px auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.grid .card{margin:0}
.hero{text-align:center;padding:50px 8px}.hero h1{font-size:clamp(2rem,8vw,3rem);margin:10px 0}.logo{display:inline-grid;place-items:center;width:80px;height:80px;border-radius:24px;font-size:42px;background:linear-gradient(135deg,var(--ac2),var(--ac))}
.tag{color:var(--ac);font-size:1.1rem;font-weight:600}.mu{color:var(--mu)}.sm{font-size:.85rem}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.c{justify-content:center}
label{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:.9rem;color:var(--mu)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.btn{font:inherit;font-weight:600;border:1px solid var(--ln);background:transparent;color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.pri{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border:0}.lnk{background:none;border:0;color:var(--ac2);cursor:pointer;font:inherit;padding:6px 0;text-decoration:underline;display:block}
.pw{position:relative;display:block}.ic{position:absolute;right:6px;top:6px;background:none;border:0;cursor:pointer;font-size:1.1rem}
.al{padding:10px 12px;border-radius:10px;margin:10px 0;border:1px solid var(--ln)}.wn{color:var(--wn);border-color:var(--wn)}.er{color:var(--bd);border-color:var(--bd)}
.bg{display:inline-block;font-size:.72rem;padding:1px 8px;border:1px solid var(--ln);border-radius:99px;color:var(--mu);margin-right:4px}.ok{color:var(--ok)}.no{color:var(--bd)}
.pr{font-weight:700;color:var(--ac2)}.ph{font-size:2.2rem;text-align:center;background:var(--bg);border-radius:12px;padding:8px;margin-bottom:6px}
.ln{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}.ln input{width:72px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);font-size:.9rem}.sc{overflow-x:auto}
.m{font-size:1.5rem;font-weight:700}.msg{padding:8px 10px;border-radius:10px;margin:6px 0;background:var(--bg)}
@media (prefers-reduced-motion:no-preference){main>*{animation:f .3s both}@keyframes f{from{opacity:0;transform:translateY(6px)}}}
</style></head>
<body>
<header><a class="brand" href="#/welcome">🛠️ FixMyHome AI</a><nav id="nav" aria-label="Pages"></nav></header>
<main id="app"></main>
<script>
const P=[
{id:1,n:"Insulated screwdriver set",b:"SampleBrand",p:349,c:"Electrical",s:25,r:4.4,sl:"Sample Seller A",w:12,i:"🪛"},
{id:2,n:"Digital voltage tester",b:"SampleBrand",p:499,c:"Electrical",s:12,r:4.2,sl:"Sample Seller A",w:6,i:"⚡"},
{id:3,n:"PTFE thread seal tape",b:"SampleBrand",p:49,c:"Plumbing",s:100,r:4.6,sl:"Sample Seller B",w:0,i:"🚰"},
{id:4,n:"Adjustable pipe wrench",b:"SampleBrand",p:599,c:"Plumbing",s:15,r:4.3,sl:"Sample Seller B",w:24,i:"🔧"},
{id:5,n:"Wall putty 5 kg",b:"SampleBrand",p:420,c:"Painting",s:30,r:4.1,sl:"Sample Seller C",w:0,i:"🎨"},
{id:6,n:"Emulsion paint 4 L",b:"SampleBrand",p:1450,c:"Painting",s:0,r:4.5,sl:"Sample Seller C",w:0,i:"🖌️"},
{id:7,n:"Wood glue 250 g",b:"SampleBrand",p:140,c:"Carpentry",s:40,r:4.0,sl:"Sample Seller D",w:0,i:"🪵"},
{id:8,n:"Claw hammer",b:"SampleBrand",p:380,c:"Carpentry",s:18,r:4.4,sl:"Sample Seller D",w:12,i:"🔨"}];
const PROS=[["Sample Professional 1","Electrician","Bengaluru"],["Sample Professional 2","Plumber","Bengaluru"],["Sample Professional 3","Painter","Mysuru"],["Sample Professional 4","Carpenter","Bengaluru"]];
const NAV=[["welcome","Welcome"],["login","Login"],["home","Home"],["scanner","Scanner"],["describe","Describe"],["analysis","Analysis"],["solutions","Solutions"],["shop","Shop"],["compare","Compare"],["kit","Repair kit"],["cart","Cart"],["orders","Orders"],["pros","Professionals"],["inventory","Inventory"],["calendar","Calendar"],["chat","HomeGPT"],["admin","Admin"]];
let cart={},cmp=new Set(),inv=[],rem=[],kit=[{id:3,q:2,why:"Reseal threaded joints"},{id:4,q:1,why:"Tighten fittings"}],chat=[],mode="login";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const prod=id=>P.find(x=>x.id==id);
const nc=(what,ep)=>`<div class="al wn"><b>Preview mode.</b> ${what} needs the FastAPI backend (<code>${ep}</code>), which isn’t connected to this page. Nothing was saved or predicted.</div>`;
const card=p=>`<div class="card"><a href="#/product/${p.id}" style="text-decoration:none;color:inherit"><div class="ph">${p.i}</div><b>${p.n}</b><div class="mu sm">${p.b} · ${p.sl}</div><div class="pr">${inr(p.price||p.p)}</div></a>
<span class="bg ${p.s>0?"ok":"no"}">${p.s>0?"In stock":"Out of stock"}</span><span class="bg">★ ${p.r}</span><span class="bg">sample</span>
<div class="row" style="margin-top:8px"><button class="btn pri" ${p.s?"":"disabled"} onclick="add(${p.id})">Add to cart</button><label style="flex-direction:row;align-items:center;margin:0"><input type="checkbox" style="width:auto" ${cmp.has(p.id)?"checked":""} onchange="cp(${p.id})"> Compare</label></div></div>`;
function toast(m){let t=document.createElement("div");t.textContent=m;t.setAttribute("role","status");t.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20";document.body.append(t);setTimeout(()=>t.remove(),2200)}
function add(id,n=1){let p=prod(id);if(!p||p.s<1)return;cart[id]=Math.min((cart[id]||0)+n,p.s);toast("Added to cart")}
function cp(id){cmp.has(id)?cmp.delete(id):cmp.size<4?cmp.add(id):toast("Compare up to 4 products");route()}
const form=(extra)=>`<form class="card" onsubmit="return false">${extra}</form>`;
const R={
welcome:()=>`<section class="hero"><div class="logo">🛠️</div><h1>FixMyHome AI</h1><p class="tag">Your Home Problem. One Intelligent Solution.</p><p class="mu">Describe a household problem, get preliminary guidance, and find the supplies to fix it.</p><div class="row c"><a class="btn pri" href="#/login">Get Started</a><a class="btn" href="#/login">Login</a></div></section>`,
login:()=>`<form class="card nar" onsubmit="return doLogin(event)"><h2>${mode=="login"?"Welcome back":"Create your account"}</h2>${mode=="login"?"":`<label>Full name<input id="fn" autocomplete="name"></label>`}<label>Email<input id="em" type="email" autocomplete="email"></label><label>Password<span class="pw"><input id="pw" type="password" autocomplete="current-password"><button type="button" class="ic" aria-label="Show or hide password" onclick="let i=$('#pw');i.type=i.type=='password'?'text':'password'">👁</button></span></label><div id="lm"></div><button class="btn pri">${mode=="login"?"Log in":"Register"}</button><button type="button" class="lnk" onclick="mode=mode=='login'?'register':'login';route()">${mode=="login"?"New here? Create an account":"Have an account? Log in"}</button><button type="button" class="lnk" onclick="toast('Password reset needs the backend email service')">Forgot password?</button></form>`,
home:()=>`<h2>Hello 👋</h2><p class="mu">What needs fixing today?</p><div class="grid">${[["scanner","📷 Scan a problem"],["describe","📝 Describe a problem"],["shop","🛒 Browse products"],["kit","🧰 Repair kit"],["pros","👷 Book a professional"],["calendar","📅 Maintenance"]].map(x=>`<a class="card" href="#/${x[0]}" style="text-decoration:none;color:inherit;font-weight:600">${x[1]}</a>`).join("")}</div><h3>Recommended products <span class="bg">sample</span></h3><div class="grid">${P.slice(0,4).map(card).join("")}</div><p class="mu sm">Recommendations, recent activity, featured sellers and reminders use live data once the backend is connected.</p>`,
scanner:()=>`<h2>AI Home Problem Scanner</h2>${form(`<label>Photo<input id="ph" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" onchange="pv(this)"></label><div id="pvw"></div><label>Category<select><option>Plumbing</option><option>Electrical</option><option>Painting / walls</option><option>Carpentry</option><option>Appliance</option></select></label><label>Description<textarea rows="3" placeholder="What does it look like?"></textarea></label><button class="btn pri" onclick="sub('Image analysis','POST /api/ai/analyze-image')">Analyse photo</button><div id="out"></div><p class="mu sm">Photos can only show visible signs. Electrical, gas or structural concerns need a qualified professional.</p>`)}`,
describe:()=>`<h2>Describe your problem</h2>${form(`<label>What is wrong?<textarea id="dt" rows="4" placeholder="e.g. Tap is dripping all night"></textarea></label><div class="row"><label>Language<select id="lg"><option value="en-IN">English</option><option value="hi-IN">हिन्दी</option><option value="kn-IN">ಕನ್ನಡ</option></select></label><label>Where?<select><option>Kitchen</option><option>Bathroom</option><option>Bedroom</option><option>Living room</option></select></label><label>Severity<select><option>Low</option><option>Medium</option><option>High</option></select></label></div><div class="row"><button class="btn" onclick="vo()">🎤 Speak</button><button class="btn pri" onclick="sub('Problem classification','POST /api/ai/classify-problem')">Analyse problem</button></div><div id="out"></div>`)}`,
analysis:()=>`<h2>AI Problem Analysis</h2><div class="card"><div class="grid"><div><div class="mu sm">Predicted category</div><div class="m">—</div></div><div><div class="mu sm">Model confidence</div><div class="m">—</div></div></div><p class="mu">Visible signs, possible causes and next steps appear here after an analysis runs on the backend.</p>${nc("Analysis results","GET /api/ai/analyses")}<div class="al wn"><b>Safety:</b> for electrical hazards, gas smells, structural cracks or major leaks, switch off the supply if safe and contact a qualified professional.</div><p class="mu sm">This is preliminary guidance, not a diagnosis. It cannot identify hidden faults.</p><a class="btn" href="#/describe">Run an analysis</a></div>`,
solutions:()=>`<h2>Recommended solutions</h2><div class="card"><h3>Example: dripping tap (low-risk)</h3><p class="mu sm">General guidance, not tailored to your analysis.</p><ol><li>Turn off the water supply to the tap.</li><li>Remove the handle and loosen the cartridge or spindle.</li><li>Replace the worn washer or cartridge.</li><li>Wrap fresh thread seal tape on threads, reassemble, then test.</li></ol><p><b>Tools:</b> adjustable wrench, screwdriver. <b>Materials:</b> thread seal tape, replacement washer.</p><p>Estimated materials: ${inr(prod(3).p*2+prod(4).p)} (sample kit)</p><div class="row"><a class="btn pri" href="#/kit">View repair kit</a><a class="btn" href="#/pros">Get professional help</a></div></div>`,
shop:()=>`<h2>Smart product shopping</h2><div class="row"><label style="flex:1;min-width:160px">Search<input id="q" oninput="sf()" placeholder="Name, brand, category"></label><label>Category<select id="ct" onchange="sf()"><option value="">All</option>${[...new Set(P.map(x=>x.c))].map(c=>`<option>${c}</option>`).join("")}</select></label><label>Max price<input id="mx" type="number" min="0" oninput="sf()" placeholder="₹"></label></div><div id="res" class="grid"></div>`,
compare:()=>{let l=[...cmp].map(prod);return`<h2>Compare products</h2>${l.length<2?`<div class="card mu">Tick “Compare” on at least two products in the shop. <a href="#/shop">Go to shop</a></div>`:`<div class="card sc"><table><tr><th></th>${l.map(p=>`<th>${p.n}</th>`).join("")}</tr>${[["Price",p=>inr(p.p)],["Brand",p=>p.b],["Warranty",p=>p.w?p.w+" months":"None listed"],["Rating",p=>"★ "+p.r],["Seller",p=>p.sl],["Availability",p=>p.s>0?"In stock ("+p.s+")":"Out of stock"],["Compatibility",p=>"Not verified"]].map(r=>`<tr><td>${r[0]}</td>${l.map(p=>`<td>${r[1](p)}</td>`).join("")}</tr>`).join("")}</table></div>`}`},
kit:()=>{let t=kit.reduce((s,k)=>s+prod(k.id).p*k.q,0);return`<h2>AI Repair Kit Generator</h2><div class="card"><p class="mu sm">Sample kit for a dripping tap. Generated kits come from <code>/api/ai/generate-repair-kit</code> once connected.</p>${kit.length?kit.map((k,i)=>{let p=prod(k.id);return`<div class="ln"><span>${p.i} <b>${p.n}</b><br><span class="mu sm">${k.why} · ${inr(p.p)} each</span></span><span class="row"><input type="number" min="1" max="${p.s||1}" value="${k.q}" aria-label="Quantity" onchange="kit[${i}].q=Math.max(1,+this.value);route()"><button class="btn" onclick="kit.splice(${i},1);route()">Remove</button></span></div>`}).join("")+`<div class="ln"><b>Total estimated budget</b><b>${inr(t)}</b></div><button class="btn pri" onclick="kit.forEach(k=>add(k.id,k.q))">Add all available items to cart</button>`:`<p class="mu">Your kit is empty.</p>`}</div>`},
cart:()=>{let ids=Object.keys(cart),sub=ids.reduce((s,i)=>s+prod(i).p*cart[i],0),d=sub&&sub<999?49:0,tx=Math.round(sub*.18);return`<h2>Cart</h2>${!ids.length?`<div class="card mu">Your cart is empty. <a href="#/shop">Browse products</a></div>`:`<div class="card">${ids.map(i=>{let p=prod(i);return`<div class="ln"><span>${p.i} ${p.n}<br><span class="mu sm">${inr(p.p)} each</span></span><span class="row"><input type="number" min="1" max="${p.s}" value="${cart[i]}" aria-label="Quantity" onchange="cart[${i}]=Math.min(Math.max(1,+this.value),${p.s});route()"><button class="btn" onclick="delete cart[${i}];route()">Remove</button></span></div>`}).join("")}<div class="ln"><span>Subtotal</span><span>${inr(sub)}</span></div><div class="ln"><span>Delivery (sample rule: ₹49 under ₹999)</span><span>${inr(d)}</span></div><div class="ln"><span>GST (sample rate 18%)</span><span>${inr(tx)}</span></div><div class="ln"><b>Total</b><b>${inr(sub+d+tx)}</b></div></div>
${form(`<h3>Checkout</h3><label>Full name<input id="an"></label><label>Delivery address<textarea id="aa" rows="2"></textarea></label><label>PIN code<input id="ap" inputmode="numeric" maxlength="6"></label><div id="out"></div><button class="btn pri" onclick="co()">Place order</button>`)}<p class="mu sm">Final prices, stock and taxes are recalculated by the backend at checkout.</p>`}`},
orders:()=>`<h2>Payments and order tracking</h2><div class="card mu" style="text-align:center;padding:30px">📦 No orders yet.</div>${nc("Order history, invoices, shipment tracking and test-mode payments","GET /api/orders")}<p class="mu sm">An order is only marked paid after the payment gateway confirms it.</p>`,
pros:()=>`<h2>Professional booking</h2><label>Trade<select onchange="window.tf=this.value;route()">${["All","Electrician","Plumber","Painter","Carpenter"].map(t=>`<option ${t==window.tf?"selected":""}>${t}</option>`).join("")}</select></label><div class="grid">${PROS.filter(x=>!window.tf||window.tf=="All"||x[1]==window.tf).map(x=>`<div class="card"><b>${x[0]}</b><div class="mu sm">${x[1]} · ${x[2]}</div><span class="bg">sample profile</span><span class="bg">Not verified</span></div>`).join("")}</div>${form(`<h3>Request a booking</h3><label>Date<input id="bd" type="date"></label><label>Time slot<select><option>Morning</option><option>Afternoon</option><option>Evening</option></select></label><label>Service details<textarea rows="2"></textarea></label><button class="btn pri" onclick="sub('Booking','POST /api/bookings')">Send request</button><div id="out"></div>`)}<p class="mu sm">No professional is shown as verified until a real verification process exists.</p>`,
inventory:()=>`<h2>My home inventory</h2>${form(`<div class="row"><label>Item<input id="in"></label><label>Brand / model<input id="ib"></label><label>Purchase date<input id="id" type="date"></label><label>Warranty (months)<input id="iw" type="number" min="0" value="12"></label></div><button class="btn pri" onclick="ai()">Add item</button>`)}<div class="card">${inv.length?inv.map((x,i)=>`<div class="ln"><span><b>${esc(x.n)}</b> <span class="mu sm">${esc(x.b)}</span><br><span class="mu sm">Bought ${esc(x.d)} · warranty ends ${wend(x)}</span></span><button class="btn" onclick="inv.splice(${i},1);route()">Delete</button></div>`).join(""):`<p class="mu">No items yet. Add an appliance to track its warranty.</p>`}</div><p class="mu sm">Items live in this page only until the inventory API is connected. Invoice upload needs storage.</p>`,
calendar:()=>{let ev=[...inv.filter(x=>x.d).map(x=>({t:"Warranty ends: "+x.n,d:wend(x)})),...rem].sort((a,b)=>a.d>b.d?1:-1);return`<h2>Maintenance and warranty calendar</h2>${form(`<div class="row"><label>Reminder<input id="rt" placeholder="e.g. Replace water filter"></label><label>Date<input id="rd" type="date"></label></div><button class="btn pri" onclick="ar()">Add reminder</button>`)}<div class="card"><h3>List view</h3>${ev.length?ev.map(e=>`<div class="ln"><span>${esc(e.t)}</span><span class="mu">${e.d}</span></div>`).join(""):`<p class="mu">Nothing scheduled. Add a reminder or an inventory item with a warranty.</p>`}</div>`},
chat:()=>`<h2>HomeGPT assistant</h2><div class="card"><div id="cm">${chat.map(m=>`<div class="msg"><b>${m[0]}:</b> ${esc(m[1])}</div>`).join("")||`<p class="mu">Ask about repairs, products, kits or warranties.</p>`}</div><div class="row"><input id="ci" style="flex:1" placeholder="Ask HomeGPT" onkeydown="if(event.key=='Enter')cs()"><button class="btn pri" onclick="cs()">Send</button></div></div>`,
admin:()=>`<h2>Admin dashboard</h2>${nc("Live analytics","GET /api/admin/analytics")}<div class="grid">${[["Total revenue","Sum of payments confirmed by the gateway"],["Order conversion rate","Completed orders ÷ sessions with an item in the cart"],["AI recommendation conversion","Purchases of a recommended product ÷ recommendation sessions"],["Registered users",""],["Total orders",""],["Pending orders",""],["Active sellers",""],["Repair requests",""],["Professional bookings",""]].map(x=>`<div class="card"><div class="mu sm">${x[0]}</div><div class="m">—</div><div class="mu sm">${x[1]}</div></div>`).join("")}</div><p class="mu sm">Metrics are calculated from database records. No invented numbers are shown here.</p>`
};
function wend(x){if(!x.d)return"—";let d=new Date(x.d);d.setMonth(d.getMonth()+x.w);return d.toISOString().slice(0,10)}
function sf(){let q=($("#q").value||"").toLowerCase(),c=$("#ct").value,m=+$("#mx").value||1e9,l=P.filter(p=>(!q||(p.n+p.b+p.c).toLowerCase().includes(q))&&(!c||p.c==c)&&p.p<=m);$("#res").innerHTML=l.length?l.map(card).join(""):`<div class="card mu">No products match your search.</div>`}
function pv(i){let f=i.files[0],o=$("#pvw");if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>5e6){i.value="";o.innerHTML=`<div class="al er">Choose a JPG, PNG or WebP image under 5 MB.</div>`;return}o.innerHTML=`<img alt="Preview" style="max-width:100%;border-radius:12px" src="${URL.createObjectURL(f)}">`}
function sub(w,e){$("#out").innerHTML=nc(w,e)}
function vo(){let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return toast("Voice input isn’t supported in this browser");let r=new S();r.lang=$("#lg").value;r.onresult=e=>$("#dt").value+=" "+e.results[0][0].transcript;r.start()}
function doLogin(e){e.preventDefault();let em=$("#em").value,pw=$("#pw").value,m=$("#lm");if(mode=="register"&&$("#fn").value.trim().length<2){m.innerHTML=`<div class="al er">Enter your full name.</div>`}else if(!/^\S+@\S+\.\S+$/.test(em)){m.innerHTML=`<div class="al er">Enter a valid email.</div>`}else if(pw.length<8){m.innerHTML=`<div class="al er">Password must be at least 8 characters.</div>`}else m.innerHTML=nc("Sign-in and registration","POST /api/auth/login")+`<a class="btn" href="#/home">Explore the preview</a>`;return false}
function co(){let ok=$("#an").value.trim().length>1&&$("#aa").value.trim().length>5&&/^\d{6}$/.test($("#ap").value);$("#out").innerHTML=ok?nc("Payment and order creation","POST /api/orders")+`<div class="al wn">No payment was taken and no order was placed.</div>`:`<div class="al er">Enter your name, a full address and a 6-digit PIN code.</div>`}
function ai(){let n=$("#in").value.trim();if(!n)return toast("Enter an item name");inv.push({n,b:$("#ib").value,d:$("#id").value,w:+$("#iw").value||0});route()}

return`<h2>Admin dashboard</h2><p class="mu sm">Figures are calculated from orders, requests and bookings made in this browser.</p><div class="grid">${M.map(x=>`<div class="card"><div class="mu sm">${x[0]}</div><div class="m">${x[1]}</div><div class="mu sm">${x[2]}</div></div>`).join("")}</div><div class="card"><h3>Monthly revenue</h3>${Object.keys(mo).sort().map(k=>bar(k,mo[k],mx(mo),inr)).join("")||"<p class=\"mu\">No orders yet.</p>"}</div><div class="card"><h3>Most reported problems</h3>${Object.keys(bc).map(k=>bar(CATS[k].n,bc[k],mx(bc))).join("")||"<p class=\"mu\">No requests yet.</p>"}</div><div class="card"><h3>Most purchased products</h3>${Object.keys(tp).sort((a,b)=>tp[b]-tp[a]).slice(0,5).map(k=>bar(esc(prod(k).n),tp[k],mx(tp))).join("")||"<p class=\"mu\">No orders yet.</p>"}</div><div class="card"><h3>All orders</h3><div class="sc"><table><tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th></tr>${orders.map(o=>`<tr><td>${o.id}</td><td>${esc(o.u)}</td><td>${inr(o.total)}</td><td>${ST[o.status]}</td></tr>`).join("")}</table></div></div>${form(`<h3>Add a product</h3><div class="row"><label>Name<input id="pn"></label><label>Brand<input id="pb"></label><label>Price ₹<input id="pp" type="number" min="1"></label><label>Stock<input id="ps" type="number" min="0"></label><label>Category<select id="pc">${Object.values(CATS).map(c=>`<option>${c.n}</option>`).join("")}</select></label></div><button class="btn pri" onclick="np()">Add product</button><div id="out"></div>`)}`};
function np(){const n=$("#pn").value.trim(),pr=+$("#pp").value,s=+$("#ps").value;if(n.length<2||pr<=0||s<0||!Number.isInteger(s))return $("#out").innerHTML=`<div class="al er">Enter a name, a positive price and a whole-number stock.</div>`;P.push({id:Math.max(...P.map(p=>p.id))+1,n,b:$("#pb").value.trim()||"Unbranded",p:pr,c:$("#pc").value,s,r:0,sl:me.name,w:0,i:"📦"});save();route()}
route=function(){const h=location.hash.replace("#/","")||"welcome",[n,a]=h.split("/");
if(n=="logout"){me=null;save();location.hash="#/welcome";return}
if(!me&&!["welcome","login"].includes(n)){location.hash="#/login";return}
if(me&&n=="login"){location.hash="#/home";return}
const it=NAV.filter(x=>me?x[0]!="login"&&x[0]!="welcome":["welcome","login"].includes(x[0]));
$("#nav").innerHTML=it.map(x=>`<a href="#/${x[0]}" class="${x[0]==n?"on":""}">${x[1]}</a>`).join("")+(me?`<a href="#/logout">Log out (${esc(me.name.split(" ")[0])} · ${me.role})</a>`:"");
app.innerHTML=n=="product"?product(a):(R[n]||R.welcome)();
if(n=="shop")sf();
if(n=="scanner")app.insertAdjacentHTML("beforeend",`<div class="al">The photo is shown for your reference. This on-device version classifies from your description and chosen category, because an image model needs a server.</div>`);
if(n=="describe")app.insertAdjacentHTML("beforeend",`<div class="al">Voice input works in Hindi and Kannada where your browser supports it, but matching uses English keywords.</div>`);
save()};
addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});route();
</script></body></html>
